<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dindin - Admin Novo Correntista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { brand: { purple: '#7C3AED' } } } } }</script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center text-white">
        <div class="flex items-center gap-2 font-bold text-xl">
            <span class="material-symbols-outlined text-brand-purple">admin_panel_settings</span> dindin Admin
        </div>
        <div class="flex items-center gap-4 text-sm font-semibold">
            <a th:href="@{/admin/correntistas}" class="text-gray-400 hover:underline">Painel Admin</a>
            <a th:href="@{/contas}" class="text-brand-purple hover:underline">Minhas Contas</a>
        </div>
    </header>

    <main class="max-w-sm mx-auto p-6 mt-6">
        <a th:href="@{/admin/correntistas}" class="text-brand-purple underline text-sm mb-4 inline-block">&larr; Voltar para o Painel</a>
        
        <div th:if="${mensagemUsernameInvalido}" class="bg-red-100 text-red-700 p-2 rounded mb-4 text-center text-sm" th:text="${mensagemUsernameInvalido}"></div>

        <div class="bg-white border border-gray-300 rounded p-6 shadow-sm">
            <h1 class="text-2xl font-bold mb-4 text-center">Adicionar Correntista</h1>
            
            <form th:action="@{/admin/correntistas}" th:object="${correntista}" method="post" class="flex flex-col gap-4">
                
                <div>
                    <label class="block font-semibold mb-1 text-sm">Nome Completo</label>
                    <input type="text" th:field="*{nome}" required class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                </div>
                
                <div>
                    <label class="block font-semibold mb-1 text-sm">E-mail (Login)</label>
                    <input type="email" th:field="*{username}" required class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-sm">Senha</label>
                    <input type="password" th:field="*{senha}" required class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-sm">Permissão</label>
                    <select th:field="*{role}" required class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple bg-white outline-none">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                
                <div class="flex gap-2 mt-2">
                    <button type="submit" class="bg-brand-purple text-white px-4 py-2 rounded font-bold w-full text-sm hover:bg-purple-700">Salvar</button>
                    <a th:href="@{/admin/correntistas}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-bold text-center w-full text-sm hover:bg-gray-300">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
