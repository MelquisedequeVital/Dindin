<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindin - Novo Correntista</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#7C3AED',
                            purpleHover: '#6D28D9',
                            pinkLight: '#FCE7F3',
                            pinkText: '#DB2777'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FAFAFA] text-gray-800 antialiased font-sans min-h-screen flex flex-col">

    <!-- Navbar Admin -->
    <header class="w-full bg-gray-900 border-b border-gray-800 px-6 lg:px-12 py-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-3 text-white">
            <span class="material-symbols-outlined text-3xl text-brand-purple">admin_panel_settings</span>
            <div class="flex flex-col">
                <span class="text-xl font-extrabold tracking-tight leading-none">dindin</span>
                <span class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Admin Panel</span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <a th:href="@{/admin/correntistas}" class="flex items-center gap-2 border border-gray-700 text-gray-300 px-4 py-2 rounded-full hover:bg-gray-800 hover:text-white transition text-sm font-semibold">
                <span class="material-symbols-outlined text-sm">close</span>
                Cancelar
            </a>
        </div>
    </header>

    <main class="flex-grow w-full max-w-2xl mx-auto px-6 lg:px-12 py-10">
        
        <div class="mb-8">
            <div class="flex items-center gap-2 text-brand-purple text-xs font-bold uppercase tracking-wider mb-2 bg-brand-purple/10 w-fit px-3 py-1 rounded-full">
                <span class="material-symbols-outlined text-sm">person_add</span> Cadastro
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900">Adicionar Correntista</h1>
            <p class="text-sm text-gray-500 mt-1">Insira os dados do novo usuário administrador ou cliente.</p>
        </div>

        <div th:if="${mensagemUsernameInvalido}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm flex items-center gap-2 shadow-sm">
            <span class="material-symbols-outlined">error</span>
            <span th:text="${mensagemUsernameInvalido}"></span>
        </div>

        <div class="bg-white border border-gray-100 rounded-2xl p-6 md:p-8 shadow-sm">
            <form th:action="@{/admin/correntistas}" method="post" th:object="${correntista}" class="space-y-6">
                
                <div class="grid grid-cols-1 gap-6">
                    <!-- Nome -->
                    <div>
                        <label for="nome" class="block text-sm font-semibold text-gray-700 mb-1.5">Nome Completo</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">person</span>
                            <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: João da Silva"
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-purple focus:border-brand-purple outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- Login/Email e Permissão -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">Login (E-mail)</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
                                <input type="email" id="username" th:field="*{username}" required placeholder="usuario@email.com"
                                    class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-purple focus:border-brand-purple outline-none transition text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="role" class="block text-sm font-semibold text-gray-700 mb-1.5">Permissão</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">admin_panel_settings</span>
                                <select id="role" th:field="*{role}" required
                                    class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-purple focus:border-brand-purple outline-none transition text-sm appearance-none cursor-pointer">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Senha -->
                    <div>
                        <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1.5">Senha</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
                            <input type="password" id="senha" th:field="*{senha}" required placeholder="Mínimo 8 caracteres"
                                class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-purple focus:border-brand-purple outline-none transition text-sm">
                            
                            <!-- Toggle visual (decorativo) -->
                            <button type="button" onclick="const p = document.getElementById('senha'); p.type = p.type === 'password' ? 'text' : 'password';" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none flex items-center">
                                <span class="material-symbols-outlined text-lg">visibility</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-grow bg-brand-purple hover:bg-brand-purpleHover text-white font-semibold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                        <span class="material-symbols-outlined text-sm">save</span>
                        Salvar Correntista
                    </button>
                    <a th:href="@{/admin/correntistas}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3.5 px-6 rounded-xl transition flex items-center justify-center sm:hidden">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>

    </main>
</body>
</html>
