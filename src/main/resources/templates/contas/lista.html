<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dindin - Minhas Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { brand: { purple: '#7C3AED' } } } } }</script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header class="bg-white border-b border-gray-300 p-4 flex justify-between items-center">
        <div class="flex items-center gap-2 text-brand-purple font-bold text-xl">
            <span class="material-symbols-outlined">savings</span> dindin
        </div>
        <div class="flex items-center gap-4 text-sm font-semibold">
            <a th:if="${session.usuarioLogado?.isAdmin()}" th:href="@{/admin/correntistas}"
                class="hover:text-brand-purple underline">Painel Admin</a>
            <details class="relative inline-block text-left group">
                <summary
                    class="flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200 text-brand-purple cursor-pointer list-none hover:bg-gray-200 transition">
                    <span class="material-symbols-outlined text-sm">person</span>
                    <span
                        th:text="${session.usuarioLogado.nome}">Usuário</span>
                    <span class="material-symbols-outlined text-sm">arrow_drop_down</span>
                </summary>
                <div
                    class="absolute right-0 mt-2 w-32 bg-white rounded-md shadow-lg border border-gray-200 z-50 overflow-hidden">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit"
                            class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100 font-semibold flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">logout</span> Sair
                        </button>
                    </form>
                </div>
            </details>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold"
                th:text="${usuarioSendoVisualizado != null} ? 'Contas de ' + ${usuarioSendoVisualizado.nome} : 'Minhas Contas'">
                Minhas Contas
            </h1>
            <a th:href="@{/contas/nova}" class="bg-brand-purple text-white px-4 py-2 rounded font-bold text-sm">+ Nova
                Conta</a>
        </div>

        <div class="bg-white border border-gray-300 rounded p-4">
            <ul class="divide-y divide-gray-200">
                <li th:each="con : ${contas}"
                    class="py-4 flex flex-col md:flex-row md:justify-between items-start md:items-center gap-4">
                    <div>
                        <a th:href="@{/contas/{id}(id=${con.id})}"
                            class="text-lg font-bold text-brand-purple hover:underline"
                            th:text="${con.descricao}">Nome</a>
                        <p class="text-sm text-gray-500">Conta: <span th:text="${con.numero}">0000</span></p>
                    </div>
                    <div class="flex items-center gap-4">
                        <a th:href="@{/contas/{id}(id=${con.id})}"
                            class="text-sm text-gray-600 hover:text-brand-purple underline">Extrato</a>
                        <form th:action="@{/contas/{id}/deletar(id=${con.id})}" th:method="post"
                            onsubmit="return confirm('Tem certeza que deseja deletar?');">
                            <button type="submit"
                                class="text-red-500 hover:text-red-700 font-bold text-sm">Excluir</button>
                        </form>
                    </div>
                </li>
            </ul>
            <p th:if="${contas == null or contas.empty}" class="text-gray-500 py-4">Nenhuma conta cadastrada.</p>
        </div>
    </main>
</body>

</html>
