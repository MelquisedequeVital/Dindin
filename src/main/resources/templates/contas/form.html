<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindin - Nova Conta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            purple: '#7C3AED',
                            purpleHover: '#6D28D9',
                            pinkLight: '#FCE7F3',
                            pinkText: '#DB2777'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FAFAFA] text-gray-800 antialiased font-sans min-h-screen flex flex-col">

    <header class="w-full bg-white border-b border-gray-100 px-6 lg:px-12 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2 text-brand-purple">
            <span class="material-symbols-outlined text-3xl">savings</span>
            <span class="text-2xl font-extrabold tracking-tight text-gray-900">dindin</span>
        </div>
        <div class="flex items-center gap-4">
            <a th:href="@{/contas}" class="hidden sm:flex items-center gap-2 border border-gray-200 text-gray-600 px-4 py-2 rounded-full hover:bg-gray-50 transition text-sm font-semibold">
                <span class="material-symbols-outlined text-sm">close</span>
                Cancelar
            </a>
        </div>
    </header>

    <main class="flex-grow w-full max-w-md mx-auto px-6 lg:px-12 py-10 flex flex-col justify-center">
        
        <div class="mb-8 text-center">
            <div class="w-16 h-16 bg-brand-purple text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md">
                <span class="material-symbols-outlined text-3xl">account_balance</span>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900">Nova Conta</h1>
            <p class="text-sm text-gray-500 mt-2">Cadastre uma nova conta para gerenciar.</p>
        </div>

        <div th:if="${mensagemContaInvalida}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm flex items-center justify-center gap-2 shadow-sm">
            <span class="material-symbols-outlined">error</span>
            <span th:text="${mensagemContaInvalida}"></span>
        </div>

        <div class="bg-white border border-gray-100 rounded-[2rem] p-8 shadow-xl">
            <form th:action="@{/contas}" th:object="${conta}" method="post" class="space-y-5">
                
                <div>
                    <label for="numero" class="block text-sm font-semibold text-gray-700 mb-1.5">Número da Conta</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">tag</span>
                        <!-- Mudado type="text" pois o backend alterou pra String -->
                        <input type="text" id="numero" th:field="*{numero}" placeholder="Ex: 12345-6" required 
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-purple focus:border-brand-purple outline-none transition text-sm">
                    </div>
                </div>

                <div>
                    <label for="descricao" class="block text-sm font-semibold text-gray-700 mb-1.5">Nome / Banco</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">edit_note</span>
                        <input type="text" id="descricao" th:field="*{descricao}" placeholder="Ex: Conta Nubank" required 
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-purple focus:border-brand-purple outline-none transition text-sm">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-brand-purple hover:bg-brand-purpleHover text-white font-semibold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                        <span class="material-symbols-outlined text-sm">add_circle</span>
                        Adicionar Conta
                    </button>
                    
                    <!-- Botão cancelar mobile -->
                    <a th:href="@{/contas}" class="mt-3 w-full bg-transparent border border-gray-200 text-gray-600 font-semibold py-3.5 rounded-xl transition flex sm:hidden items-center justify-center">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
