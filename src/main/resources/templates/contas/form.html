<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/correntista(titulo='Nova Conta', menuSair=false)}">

<body>

    <main layout:fragment="conteudo" class="max-w-sm mx-auto p-6 mt-6">
        <a th:href="@{/contas}" class="text-brand-purple underline text-sm mb-4 inline-block">&larr; Voltar</a>

        <div th:if="${mensagemContaInvalida}" class="bg-red-100 text-red-700 p-2 rounded mb-4 text-center text-sm"
            th:text="${mensagemContaInvalida}"></div>

        <div class="bg-white border border-gray-300 rounded p-6 shadow-sm">
            <h1 class="text-2xl font-bold mb-4 text-center">Nova Conta</h1>

            <form th:action="@{/contas}" th:object="${contaForm}" method="post" class="flex flex-col gap-4">

                <div>
                    <label class="block font-semibold mb-1 text-sm">Tipo de Conta</label>
                    <select id="selectTipoConta" th:field="*{tipoConta}" onchange="toggleCamposCredito()"
                        class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none bg-white">
                        <option value="CORRENTE">Conta Débito / Comum</option>
                        <option value="CREDITO">Cartão de Crédito</option>
                    </select>
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-sm">Número da Conta</label>
                    <input type="text" th:field="*{numero}" required
                        class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                </div>

                <div>
                    <label class="block font-semibold mb-1 text-sm">Nome / Banco</label>
                    <input type="text" th:field="*{descricao}" required
                        class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                </div>

                <div id="camposCredito" class="hidden flex flex-col gap-4 border-t border-gray-200 pt-3">
                    <div>
                        <label class="block font-semibold mb-1 text-sm text-purple-900">Limite do Cartão (R$)</label>
                        <input type="number" step="0.01" th:field="*{limiteCredito}" placeholder="Ex: 2500.00"
                            class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                    </div>

                    <div>
                        <label class="block font-semibold mb-1 text-sm text-purple-900">Dia de Fechamento da
                            Fatura</label>
                        <input type="number" min="1" max="31" th:field="*{diaFechamento}" placeholder="Ex: 10"
                            class="w-full border border-gray-300 rounded p-2 text-sm focus:border-brand-purple outline-none">
                    </div>
                </div>

                <div class="flex gap-2 mt-2">
                    <button type="submit"
                        class="bg-brand-purple text-white px-4 py-2 rounded font-bold w-full text-sm hover:bg-purple-700">Salvar</button>
                    <a th:href="@{/contas}"
                        class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-bold text-center w-full text-sm hover:bg-gray-300">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    <script layout:fragment="scripts">
        function toggleCamposCredito() {
            const selectTipo = document.getElementById('selectTipoConta');
            const camposCredito = document.getElementById('camposCredito');

            if (selectTipo.value === 'CREDITO') {
                camposCredito.classList.remove('hidden');
            } else {
                camposCredito.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', toggleCamposCredito);
    </script>
</body>

</html>
