<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindin - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { purple: '#7C3AED' } } } } }
    </script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md border border-gray-100">
        

        <div class="text-brand-purple flex items-center justify-center gap-2 mb-6">
            <span class="material-symbols-outlined text-4xl">savings</span>
            <span class="text-3xl font-bold">dindin</span>
        </div>

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Crie sua conta</h2>
        <p class="text-gray-500 text-center mb-6 text-sm">Preencha os dados abaixo para começar</p>

        <div th:if="${mensagemErro}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded text-sm text-center">
            <span th:text="${mensagemErro}"></span>
        </div>

        <!-- Form de Cadastro -->
        <form th:action="@{/cadastro}" th:object="${usuario}" method="post" class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                <input type="text" th:field="*{nome}" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-purple focus:outline-none"
                    placeholder="Seu nome">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail ou CPF (Login)</label>
                <input type="text" th:field="*{username}" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-purple focus:outline-none"
                    placeholder="Ex: joaosilva@gmail.com"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" th:field="*{senha}" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-purple focus:outline-none"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-brand-purple text-white font-bold py-2.5 rounded-lg hover:bg-purple-700 transition">
                Cadastrar
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Já tem uma conta?
            <a th:href="@{/login}" class="text-brand-purple font-bold hover:underline">Fazer Login</a>
        </p>

    </div>

</body>

</html>
