<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { purple: '#7C3AED' } } } } }
    </script>
</head>
<body class="bg-pink-500 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded p-8 w-full max-w-sm flex flex-col items-center">
        <div class="text-brand-purple mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined text-4xl">savings</span>
            <span class="text-2xl font-bold">dindin</span>
        </div>
        <h1 class="text-xl font-bold mb-4">Acesse sua conta</h1>
        
        <div th:if="${mensagemCredenciaisInvalidas != null and !mensagemCredenciaisInvalidas.isEmpty()}" class="w-full text-center bg-red-100 text-red-700 p-2 rounded mb-4 text-sm" th:text="${mensagemCredenciaisInvalidas}"></div>
        
        <form th:action="@{/login}" method="post" class="w-full flex flex-col gap-4">
            <div>
                <label for="username" class="block text-sm font-semibold mb-1">E-mail ou CPF</label>
                <input type="text" id="username" name="username" required class="w-full border border-gray-300 rounded p-2 focus:border-brand-purple outline-none">
            </div>
            <div>
                <label for="senha" class="block text-sm font-semibold mb-1">Senha</label>
                <input type="password" id="senha" name="senha" required class="w-full border border-gray-300 rounded p-2 focus:border-brand-purple outline-none">
            </div>
            <button type="submit" class="w-full bg-brand-purple text-white font-bold py-2 rounded hover:bg-purple-700">Entrar na conta</button>
        </form>
        
        <div class="mt-4 text-sm">
            <span>Não tem uma conta?</span>
            <a th:href="@{/usuarios/form}" class="text-brand-purple font-bold underline">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
