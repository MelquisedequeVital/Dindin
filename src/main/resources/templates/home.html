<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dindin - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { purple: '#7C3AED' } } } } }
    </script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6 text-center">


    <div class="text-brand-purple flex items-center gap-2 mb-6">
        <span class="material-symbols-outlined text-5xl">savings</span>
        <span class="text-4xl font-extrabold">dindin</span>
    </div>

    <h1 class="text-3xl font-bold mb-4">Suas finanças em ordem</h1>
    <p class="text-gray-600 mb-8 max-w-md">O jeito leve e simples de cuidar das suas contas. Sem complicação.</p>

    <div th:if="${mensagemLogout}"
        class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg max-w-md w-full">
        <span th:text="${mensagemLogout}"></span>
    </div>

    <div class="flex gap-4">
        <a th:href="@{/login}"
            class="border border-brand-purple text-brand-purple font-bold py-2 px-6 rounded hover:bg-brand-purple hover:text-white transition">Entrar</a>
        <a th:href="@{/cadastro}"
            class="bg-brand-purple text-white font-bold py-2 px-6 rounded hover:bg-purple-700 transition">Criar
            Conta</a>
    </div>



</body>

</html>
