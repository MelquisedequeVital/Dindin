<!DOCTYPE html>
<!--/*
    Layout das telas públicas (home, login, cadastro): sem header, conteúdo centralizado.
    Parâmetros: titulo (obrigatório)
    Uso: <html layout:decorate="~{layouts/publico(titulo='Login')}">
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head th:replace="~{fragments/head :: head(${titulo})}"></head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <main layout:fragment="conteudo"></main>

    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
