<!DOCTYPE html>
<!--/*
    Layout das telas do administrador.
    Parâmetros: titulo (obrigatório), linkPainel e menuSair (opcionais, padrão true,
    repassados para o fragment fragments/header :: cabecalhoAdmin)
    Uso: <html layout:decorate="~{layouts/admin(titulo='Admin Correntistas', linkPainel=false)}">
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head th:replace="~{fragments/head :: head(${titulo})}"></head>

<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header th:replace="~{fragments/header :: cabecalhoAdmin(linkPainel=${linkPainel}, menuSair=${menuSair})}"></header>

    <main layout:fragment="conteudo"></main>

    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
